<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#07111d"/>
<title>Predikt</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}iframe{display:block;width:100%;height:100dvh;border:0;background:#07111d}</style>
</head>
<body>
<iframe id="shell" src="/predikt-app.html" title="Predikt sportsbook"></iframe>
<script>
const PATCH=`
(function(){
  if(document.documentElement.dataset.prediktBrandV5==='1') return;
  document.documentElement.dataset.prediktBrandV5='1';

  const fa=document.createElement('link');
  fa.rel='stylesheet';
  fa.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css';
  fa.crossOrigin='anonymous';
  document.head.appendChild(fa);

  const css=document.createElement('style');
  css.textContent=\`
    .brand-mark{font-family:Inter,system-ui,sans-serif}
    .square i,.mobile-dock i,.menu-item i,.rail-btn i,.ico i,.sport-tab i{font-size:14px;line-height:1}
    .mobile-dock button{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:4px}
    .mobile-dock button i{font-size:16px}.mobile-dock small{margin-top:0!important}
    .menu-item>span:first-child{width:34px!important;height:34px;border-radius:10px;display:grid;place-items:center;background:#14283d;color:#8ea5bb;flex:none}
    .menu-item:hover>span:first-child{color:var(--green);background:#17382f}
    .rail-btn>span:first-child{width:26px!important;height:26px;display:grid;place-items:center;flex:none}
    .country-flag{width:22px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
    .flag .country-flag{width:24px;height:17px}.flag{overflow:hidden}
    .sport-tab{display:inline-flex;align-items:center;gap:7px}.sport-tab i{width:14px;text-align:center}
    .search-wrap:before{content:'\\f002';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#637a91;font-size:12px;z-index:2;pointer-events:none}.search{padding-left:33px!important}
    .payment-brand{width:54px;height:38px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;padding:5px;overflow:hidden;flex:none;border:1px solid rgba(255,255,255,.14)}
    .payment-brand img{width:100%;height:100%;object-fit:contain;display:block}.payment-brand.cbe img{padding:2px}.payment-brand.bank{background:#14283d;color:#b8c7d6;font-size:16px}
    .brand-fallback{display:none;width:100%;height:100%;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#0b1724;text-align:center;line-height:1}
    .method .payment-brand+.copy{margin-left:2px}.method.sel .payment-brand{box-shadow:0 0 0 2px rgba(47,212,164,.28)}
    .method>i.fa-chevron-right,.method>i.fa-check{margin-left:auto;color:var(--faint)}.method.sel>i.fa-check{color:var(--green)}
    .wallet-brand-note{margin-top:8px;font-size:8px;color:var(--faint);line-height:1.4}
    .standard-icon{width:18px;text-align:center;color:inherit}
    .live-icon{color:var(--red)!important}.fav-icon{color:var(--yellow)!important}
  \`;
  document.head.appendChild(css);

  const flagMap={Ethiopia:'et',England:'gb',Spain:'es',Italy:'it',Germany:'de',France:'fr',USA:'us',Europe:'eu'};
  const flagHtml=c=>flagMap[c]?\`<img class="country-flag" alt="${c} flag" src="https://flagcdn.com/w40/${flagMap[c]}.png">\`:c==='International'?'<i class="fa-solid fa-earth-africa"></i>':'<i class="fa-solid fa-fire-flame-curved"></i>';
  window.countryIcon=function(c){return flagHtml(c)};
  if(window.sports){Object.values(sports).forEach(s=>s.leagues.forEach(l=>{l.flag=flagHtml(l.country)}));}
  if(window.liveData){Object.values(liveData).forEach(arr=>arr.forEach(l=>{l.flag='<i class="fa-solid fa-tower-broadcast live-icon"></i>'}));}

  const sportIcon={football:'fa-futbol',basketball:'fa-basketball',tennis:'fa-table-tennis-paddle-ball',esports:'fa-gamepad',volleyball:'fa-volleyball',motorsport:'fa-flag-checkered'};
  window.buildSportsTabs=function(){
    const el=document.getElementById('sportsTabs'); if(!el||!window.sports) return;
    el.innerHTML=Object.entries(sports).map(([k,s])=>\`<button class="sport-tab ${k===currentSport?'on':''}" onclick="setSport('${k}')"><i class="fa-solid ${sportIcon[k]||'fa-circle'}"></i>${s.label}</button>\`).join('')+\`<button class="sport-tab" onclick="showFavorites()"><i class="fa-solid fa-star fav-icon"></i>Favorites</button>\`;
  };

  window.renderPaymentMethods=function(){
    const el=document.getElementById('paymentMethods'); if(!el) return;
    const methods=[
      ['Telebirr','https://www.ethiotelecom.et/wp-content/uploads/2025/10/telebirr-logo-01.png','Official telebirr mobile-money brand','telebirr'],
      ['M-PESA','https://img.logokit.com/m-pesa.com','M-PESA mobile-money brand','mpesa'],
      ['CBE Birr','https://img.logokit.com/combanketh.et','Commercial Bank of Ethiopia digital wallet','cbe'],
      ['Bank transfer','', 'Reference bank-transfer method','bank']
    ];
    el.innerHTML=methods.map(m=>{
      const logo=m[1]?\`<span class="payment-brand ${m[3]}"><img src="${m[1]}" alt="${m[0]} logo" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="brand-fallback">${m[0]}</span></span>\`:\`<span class="payment-brand bank"><i class="fa-solid fa-building-columns"></i></span>\`;
      return \`<button class="method ${m[0]===method?'sel':''}" onclick="pickMethod('${m[0]}')" title="Select ${m[0]}">${logo}<span class="copy"><strong>${m[0]}</strong><small>${m[2]}</small></span><i class="fa-solid ${m[0]===method?'fa-check':'fa-chevron-right'}"></i></button>\`;
    }).join('')+`<div class="wallet-brand-note">Payment brands are shown for identification in this sandbox. No live payment request is created.</div>`;
  };

  window.renderWalletHistory=function(){
    const el=document.getElementById('walletHistory'); if(!el) return;
    el.innerHTML=walletLog.length?walletLog.map(x=>\`<div class="method"><span class="ico"><i class="fa-solid ${x.amount>=0?'fa-arrow-down':'fa-arrow-up'}"></i></span><span class="copy"><strong>${x.title}</strong><small>${x.time} · ${x.ref}</small></span><b style="color:${x.amount>=0?'var(--green)':'var(--yellow)'}">${x.amount>=0?'+':''}${x.amount.toLocaleString()} ETB</b></div>\`).join(''):\`<div class="empty-state"><strong>No wallet activity</strong></div>\`;
  };

  function iconize(){
    const notif=document.querySelector('.square.has-badge');
    if(notif){const dot=notif.querySelector('#notifDot');notif.innerHTML='<i class="fa-regular fa-bell"></i>';if(dot)notif.appendChild(dot);notif.title='Notifications';}
    const menu=document.querySelector('.header .square:last-child'); if(menu){menu.title='Account menu';}

    const md=[['fa-house','Sports'],['fa-tower-broadcast','Live'],['fa-receipt','Bet slip'],['fa-wallet','Wallet'],['fa-user','Account']];
    document.querySelectorAll('.mobile-dock button').forEach((b,i)=>{if(md[i]){const small=b.querySelector('small');const badge=b.querySelector('b');b.innerHTML=\`<i class="fa-solid ${md[i][0]}"></i>\`;if(small)b.appendChild(small);if(badge)b.appendChild(badge);b.title=md[i][1];}});

    const drawerIcons=['fa-wallet','fa-id-card','fa-clock-rotate-left','fa-bell','fa-language','fa-shield-halved','fa-headset'];
    document.querySelectorAll('.drawer .menu-item').forEach((b,i)=>{const holder=b.querySelector('span:first-child');if(holder&&drawerIcons[i])holder.innerHTML=\`<i class="fa-solid ${drawerIcons[i]}"></i>\`;});

    const railButtons=[...document.querySelectorAll('.rail .rail-card>.rail-btn')];
    railButtons.slice(-3).forEach((b,i)=>{const holder=b.querySelector('span:first-child');const icons=['fa-tower-broadcast','fa-clock','fa-star'];if(holder)holder.innerHTML=\`<i class="fa-solid ${icons[i]} ${i===0?'live-icon':i===2?'fav-icon':''}"></i>\`;});

    const adminIcos=[...document.querySelectorAll('#adminModal .method .ico')];
    const aicons=['fa-pause','fa-rotate','fa-triangle-exclamation'];
    adminIcos.forEach((n,i)=>{if(aicons[i])n.innerHTML=\`<i class="fa-solid ${aicons[i]}"></i>\`;});

    const closeBtns=document.querySelectorAll('.close');closeBtns.forEach(b=>{b.innerHTML='<i class="fa-solid fa-xmark"></i>';b.title='Close';});
    const searchClear=document.querySelector('.search-clear');if(searchClear){searchClear.innerHTML='<i class="fa-solid fa-xmark"></i>';searchClear.title='Clear search';}
  }

  const oldRenderAll=window.renderAll;
  if(typeof oldRenderAll==='function'){
    window.renderAll=function(){oldRenderAll();buildSportsTabs();renderPaymentMethods();iconize();};
  }
  const oldOpenWallet=window.openWallet;
  if(typeof oldOpenWallet==='function')window.openWallet=function(){oldOpenWallet();renderPaymentMethods();iconize();};
  const oldOpenAdmin=window.openAdmin;
  if(typeof oldOpenAdmin==='function')window.openAdmin=function(){oldOpenAdmin();iconize();};

  try{buildSportsTabs();renderPaymentMethods();renderRail();renderAll();}catch(e){console.warn('Predikt brand patch render',e)}
  iconize();
  setTimeout(iconize,600);
})();
`;

function applyBrandPatch(){
  try{
    const outer=document.getElementById('shell');
    const outerDoc=outer.contentDocument;
    const inner=outerDoc&&outerDoc.getElementById('app');
    const target=inner&&inner.contentWindow;
    if(!target||!target.document||!target.document.body) return false;
    if(target.document.documentElement.dataset.prediktBrandV5==='1') return true;
    target.eval(PATCH);
    return true;
  }catch(e){console.error('Predikt branding patch failed',e);return false;}
}

document.getElementById('shell').addEventListener('load',()=>{
  let tries=0;
  const timer=setInterval(()=>{tries++;if(applyBrandPatch()||tries>50)clearInterval(timer)},200);
});
setTimeout(applyBrandPatch,1200);
</script>
</body>
</html>
