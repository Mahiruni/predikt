<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><title>Predikt</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}iframe{display:block;width:100%;height:100dvh;border:0;background:#07111d}</style></head><body><iframe id="app" src="/predikt-sportsbook-v4.html" title="Predikt interactive sportsbook"></iframe><script type="text/plain" id="patchCode">
(function(){
const enc=s=>encodeURIComponent(String(s));
renderLeagues=function(data,target,prefix,isLive=false){let visible=0;const blocks=data.map((l,li)=>{if(prefix==='pre'&&!leagueMatches(l))return'';const evs=l.events.map((e,ei)=>({e,ei})).filter(x=>!prefix.includes('pre')||eventMatches(l,x.e));if(!evs.length)return'';visible+=evs.length;const fav=favorites.has(l.league);const eventHtml=evs.map(({e,ei})=>{const key=eventKey(prefix,li,ei),choices=choicesFor(e),eventName=enc(e[1]+' vs '+e[2]),leagueName=enc(l.league);return `<div class="event ${isLive?'live-event':''}"><div class="event-info" onclick="openEvent('${prefix}',${li},${ei})"><div class="time">${isLive?'<span class="live-badge"><i></i>'+e[0]+'</span>':e[0]}</div><div class="teams"><span>${e[1]}</span><span>${e[2]}</span></div><div class="event-meta">${sports[currentSport].market} · Activity ${e[4]}%</div></div>${e[3].map((o,j)=>`<button class="odd ${selections[key]?.choice===choices[j]?'sel':''} ${j===0?'up':j===e[3].length-1?'down':''}" onclick="selectOdd('${key}','${choices[j]}',${o},decodeURIComponent('${eventName}'),decodeURIComponent('${leagueName}'))">${o.toFixed(2)}</button>`).join('')}${e[3].length===2?'<button class="odd" disabled style="opacity:.25">—</button>':''}<button class="more" onclick="openMoreMarkets('${prefix}',${li},${ei})">+${28+(li*7+ei*5)%44}</button></div>`}).join('');return `<section class="league-block"><div class="league-head"><button class="flag" onclick="setCountry('${l.country.replace(/'/g,"\\'")}')">${l.flag}</button><button class="league-name" style="border:0;background:transparent;color:var(--text);text-align:left" onclick="openLeagueInfo(decodeURIComponent('${enc(l.league)}'),decodeURIComponent('${enc(l.country)}'))">${l.league}</button><span class="muted" style="font-size:8px">${evs.length} events</span><button class="star ${fav?'on':''}" onclick="toggleFavorite(decodeURIComponent('${enc(l.league)}'))">★</button></div><div class="market-head"><span>EVENT</span><span>${eHead(0)}</span><span>${eHead(1)}</span><span>${eHead(2)}</span><span></span></div>${eventHtml}</section>`}).join('');document.getElementById(target).innerHTML=blocks||`<div class="empty-state"><strong>No matching events</strong><p>Try another country, filter, sport or search term.</p><button class="btn secondary" style="width:auto;padding:0 16px" onclick="resetFilters()">RESET FILTERS</button></div>`;if(target==='prematchLeagues')visibleEvents.textContent=visible;return visible};
renderSingleLeague=function(l,li){const evs=l.events;return `<section class="league-block"><div class="league-head"><button class="flag" onclick="setCountry('${l.country.replace(/'/g,"\\'")}')">${l.flag}</button><span class="league-name">${l.league}</span><button class="star on" onclick="toggleFavorite(decodeURIComponent('${enc(l.league)}'))">★</button></div><div class="market-head"><span>EVENT</span><span>${eHead(0)}</span><span>${eHead(1)}</span><span>${eHead(2)}</span><span></span></div>${evs.map((e,ei)=>{const key=eventKey('pre',li,ei),choices=choicesFor(e),eventName=enc(e[1]+' vs '+e[2]),leagueName=enc(l.league);return `<div class="event"><div class="event-info" onclick="openEvent('pre',${li},${ei})"><div class="time">${e[0]}</div><div class="teams"><span>${e[1]}</span><span>${e[2]}</span></div></div>${e[3].map((o,j)=>`<button class="odd ${selections[key]?.choice===choices[j]?'sel':''}" onclick="selectOdd('${key}','${choices[j]}',${o},decodeURIComponent('${eventName}'),decodeURIComponent('${leagueName}'))">${o.toFixed(2)}</button>`).join('')}${e[3].length===2?'<button class="odd" disabled style="opacity:.25">—</button>':''}<button class="more" onclick="openMoreMarkets('pre',${li},${ei})">+32</button></div>`}).join('')}</section>`};
openMoreMarkets=function(prefix,li,ei){const {league,event}=getEvent(prefix,li,ei);moreMarketsTitle.textContent=event[1]+' vs '+event[2];const groups=[['Double chance',[['1X',1.31],['12',1.28],['X2',1.54]]],['Total goals',[['Over 1.5',1.36],['Under 1.5',2.95],['Over 2.5',1.92],['Under 2.5',1.84]]],['Both teams to score',[['Yes',1.79],['No',1.95]]],['First half',[['Home',2.55],['Draw',2.05],['Away',3.40]]]];moreMarketsBody.innerHTML=groups.map((g,gi)=>`<div class="market-group"><h4>${g[0]}</h4><div class="market-options">${g[1].map((o,oi)=>{const key=`extra-${currentSport}-${prefix}-${li}-${ei}-${gi}-${oi}`,choice=enc(o[0]),eventName=enc(event[1]+' vs '+event[2]),leagueName=enc(league.league+' · '+g[0]);return `<button class="market-option ${selections[key]?'sel':''}" onclick="selectOdd('${key}',decodeURIComponent('${choice}'),${o[1]},decodeURIComponent('${eventName}'),decodeURIComponent('${leagueName}'));openMoreMarkets('${prefix}',${li},${ei})">${o[0]} · ${o[1].toFixed(2)}</button>`}).join('')}</div></div>`).join('');moreMarketsModal.classList.add('on')};
openResponsible=function(){const stored=JSON.parse(localStorage.getItem('predikt-v4')||'{}');document.getElementById('practiceLimit').value=stored.practiceLimit||'';document.getElementById('selfExcludeBtn').textContent=stored.selfExcluded?'DISABLE SANDBOX SELF-EXCLUSION':'ENABLE SANDBOX SELF-EXCLUSION';responsibleModal.classList.add('on')};
renderAll();
})();
</script><script>function patchApp(){try{const f=document.getElementById('app');f.contentWindow.eval(document.getElementById('patchCode').textContent)}catch(e){console.error('Predikt patch failed',e)}}document.getElementById('app').addEventListener('load',patchApp);</script></body></html>
